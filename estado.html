<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguimiento de Reparación · OpenLine</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;padding:16px;box-sizing:border-box}main{width:min(100%,420px);background:#18181b;border:1px solid #3f3f46;border-radius:24px;padding:24px;box-sizing:border-box}h1{font-size:20px;margin:0 0 4px}p{font-size:13px;color:#a1a1aa}.error{color:#fda4af}.card{margin-top:20px;padding:16px;border-radius:16px;background:#172554;border:1px solid #3b82f6}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #27272a;font-size:13px}.hidden{display:none}</style>
</head>
<body><main><h1 id="name">OpenLine</h1><p id="order">Validando enlace seguro…</p><div id="card" class="hidden"><div class="card"><b id="status"></b><p id="device"></p><p id="fault"></p></div><div class="row"><span>Presupuesto</span><b id="budget"></b></div><div class="row"><span>Seña</span><b id="advance"></b></div><div class="row"><span>Resta</span><b id="due"></b></div></div><p id="error" class="error hidden">Enlace inválido o incompleto. Solicita un nuevo enlace al taller.</p></main>
<script>
(async function () {
  var p = new URLSearchParams(location.search), w = p.get('w'), id = p.get('id'), tk = p.get('tk');
  if (!w || !id || !tk) { document.getElementById('error').classList.remove('hidden'); return; }
  try {
    var r = await fetch('/api/public/orders?workshopId=' + encodeURIComponent(w) + '&orderId=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(tk));
    if (!r.ok) throw new Error();
    var d = await r.json(), total = Number(d.budget) || 0, adv = Number(d.advance) || 0;
    document.getElementById('name').textContent = d.workshopName || 'OpenLine';
    document.getElementById('order').textContent = 'Orden #' + d.id;
    document.getElementById('status').textContent = d.status || 'WAITING';
    document.getElementById('device').textContent = 'Equipo: ' + [d.brand, d.model].filter(Boolean).join(' ');
    document.getElementById('fault').textContent = 'Falla: ' + (d.fault || 'Diagnóstico general');
    document.getElementById('budget').textContent = '$' + total.toLocaleString('es-AR');
    document.getElementById('advance').textContent = '$' + adv.toLocaleString('es-AR');
    document.getElementById('due').textContent = '$' + Math.max(0, total - adv).toLocaleString('es-AR');
    document.getElementById('card').classList.remove('hidden');
  } catch (_) { document.getElementById('error').classList.remove('hidden'); }
}());
</script>
</body>
</html>
