<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguimiento de Equipo · OpenLine</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;padding:16px;box-sizing:border-box}
    main{width:min(100%,400px);background:#18181b;border:1px solid #3f3f46;border-radius:24px;padding:24px;box-sizing:border-box;box-shadow:0 20px 60px #0008}
    h1{font-size:20px;margin:0 0 4px}p{font-size:13px;color:#a1a1aa}.status{padding:16px;border-radius:16px;background:#172554;border:1px solid #3b82f6;margin:20px 0}.label{font-size:10px;color:#a1a1aa;text-transform:uppercase;font-weight:700}.value{font-size:16px;font-weight:700;margin-top:4px} .error{color:#fda4af}.money{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #27272a;font-size:13px}
  </style>
</head>
<body><main>
  <h1 id="title">Seguimiento de equipo</h1><p id="order">Validando enlace seguro…</p>
  <div id="content" class="hidden"><div class="status"><div class="label">Estado</div><div id="status" class="value"></div></div><p><b>Equipo:</b> <span id="device"></span></p><p><b>Falla:</b> <span id="fault"></span></p><div class="money"><span>Presupuesto</span><b id="budget"></b></div><div class="money"><span>Seña</span><b id="advance"></b></div><div class="money"><span>Resta</span><b id="due"></b></div><p id="updated"></p></div>
  <p id="error" class="error hidden">Enlace inválido o vencido.</p>
</main>
<script>
(async function () {
  var params = new URLSearchParams(location.search);
  var w = params.get('w'), id = params.get('id'), tk = params.get('tk');
  if (!w || !id || !tk) { document.getElementById('error').classList.remove('hidden'); document.getElementById('order').textContent = 'Orden no disponible'; return; }
  try {
    var response = await fetch('/api/public/orders?workshopId=' + encodeURIComponent(w) + '&orderId=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(tk));
    if (!response.ok) throw new Error('not_found');
    var data = await response.json();
    document.getElementById('title').textContent = data.workshopName || 'Seguimiento de equipo';
    document.getElementById('order').textContent = 'Orden #' + data.id;
    document.getElementById('status').textContent = data.status || 'WAITING';
    document.getElementById('device').textContent = [data.brand, data.model].filter(Boolean).join(' ') || 'Equipo';
    document.getElementById('fault').textContent = data.fault || 'Diagnóstico general';
    var total = Number(data.budget) || 0, advance = Number(data.advance) || 0;
    document.getElementById('budget').textContent = '$' + total.toLocaleString('es-AR');
    document.getElementById('advance').textContent = '$' + advance.toLocaleString('es-AR');
    document.getElementById('due').textContent = '$' + Math.max(0, total - advance).toLocaleString('es-AR');
    document.getElementById('updated').textContent = data.updatedAt ? 'Última actualización: ' + new Date(data.updatedAt).toLocaleString('es-AR') : '';
    document.getElementById('content').classList.remove('hidden');
  } catch (_) { document.getElementById('error').classList.remove('hidden'); document.getElementById('order').textContent = 'Orden no disponible'; }
}());
</script>
</body>
</html>
