<!DOCTYPE html>
<html lang="es" class="bg-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLine - Panel Maestro Independiente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex items-center justify-center p-4">

  <!-- PANTALLA DE LOGIN -->
  <div id="loginView" class="w-full max-w-sm bg-zinc-900 border border-indigo-900/50 rounded-2xl p-6 shadow-2xl">
    <div class="w-12 h-12 rounded-xl bg-indigo-950 flex items-center justify-center text-indigo-400 mx-auto mb-4 border border-indigo-800">
      <i class="ph-bold ph-lock-key text-2xl"></i>
    </div>
    <h1 class="text-center text-lg font-bold text-white mb-2">Panel Maestro Central</h1>
    <p class="text-center text-xs text-zinc-400 mb-6">Administración de Red OpenLine</p>
    
    <form onsubmit="window.unlockPanel(event)" class="space-y-4">
      <div>
        <label class="text-[10px] font-bold text-zinc-400 uppercase block mb-1">PIN Creador</label>
        <input type="password" id="inpPin" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white text-center font-mono tracking-[0.3em] outline-none focus:border-indigo-500 transition" required placeholder="••••">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg transition active:scale-95">Desbloquear Panel</button>
    </form>
  </div>

  <!-- PANEL DE CONTROL -->
  <div id="dashboardView" class="hidden w-full max-w-3xl bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl flex-col max-h-[90vh]">
    <div class="p-4 border-b border-zinc-800 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2">
        <i class="ph-bold ph-globe-hemisphere-west text-indigo-400 text-xl"></i>
        <div>
          <h2 class="text-white font-bold text-sm">Control de Red Global</h2>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span id="connDot" class="w-2 h-2 rounded-full bg-rose-500"></span>
            <span id="connText" class="text-[9px] font-mono text-zinc-400 uppercase">Desconectado</span>
          </div>
        </div>
      </div>
      <div class="flex gap-2">
        <button type="button" onclick="window.requestTelemetryBroadcast()" class="px-3 py-1.5 rounded-lg bg-indigo-950 text-indigo-300 font-bold text-xs flex items-center gap-1.5 hover:bg-indigo-900 border border-indigo-800 transition shadow">
          <i class="ph-bold ph-arrows-clockwise"></i> Sondear Talleres
        </button>
        <button type="button" onclick="location.reload()" class="px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 font-bold text-xs hover:bg-zinc-700 transition">Salir</button>
      </div>
    </div>

    <!-- ESTADÍSTICAS -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 p-4 shrink-0">
      <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-center">
        <span class="text-[9px] text-zinc-500 uppercase font-bold block mb-1">Total Registrados</span>
        <b id="statTotal" class="text-xl font-mono text-white">0</b>
      </div>
      <div class="bg-zinc-950 border border-emerald-900/30 rounded-xl p-3 text-center">
        <span class="text-[9px] text-emerald-500 uppercase font-bold block mb-1">En Línea Ahora</span>
        <b id="statOnline" class="text-xl font-mono text-emerald-400">0</b>
      </div>
      <div class="bg-zinc-950 border border-amber-900/30 rounded-xl p-3 text-center">
        <span class="text-[9px] text-amber-500 uppercase font-bold block mb-1">Licencias DEMO</span>
        <b id="statDemo" class="text-xl font-mono text-amber-400">0</b>
      </div>
      <div class="bg-zinc-950 border border-indigo-900/30 rounded-xl p-3 text-center">
        <span class="text-[9px] text-indigo-400 uppercase font-bold block mb-1">Licencias PRO</span>
        <b id="statPro" class="text-xl font-mono text-indigo-400">0</b>
      </div>
    </div>

    <!-- LISTA DE TALLERES -->
    <div class="flex-1 overflow-y-auto px-4 pb-4 space-y-2" id="workshopsList">
      <div class="text-center text-zinc-500 text-xs py-8">Esperando conexión MQTT...</div>
    </div>

    <!-- ASIGNACIÓN MANUAL -->
    <div class="p-4 border-t border-zinc-800 bg-zinc-950 rounded-b-2xl shrink-0">
      <span class="text-[10px] font-bold text-zinc-400 uppercase block mb-2">Asignación Manual (Talleres fuera de línea):</span>
      <div class="flex gap-2">
        <input type="text" id="manualCode" placeholder="TALLER-XXXX" class="w-1/3 bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-white font-mono uppercase text-xs outline-none focus:border-indigo-500">
        <select id="manualType" class="bg-zinc-900 border border-zinc-700 rounded-xl px-2 py-2 text-white text-xs outline-none font-bold">
          <option value="LIFETIME">Vitalicia</option>
          <option value="SEM6">6 Meses</option>
          <option value="DEMO">Demo</option>
        </select>
        <button type="button" onclick="window.activateManual()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 transition active:scale-95 shadow">
          <i class="ph-bold ph-paper-plane-tilt"></i> Enviar Licencia
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed top-4 right-4 z-[100000] flex flex-col items-end gap-2 pointer-events-none"></div>

  <script>
    var TELEMETRY_KEY = 'openline_master_telemetry_registry';
    var mqttClient = null;
    var masterDeviceId = 'master_' + Math.random().toString(36).substring(2, 9);
    var targetPin = '8408'; 

    function $(id) { return document.getElementById(id); }

    window.showToast = function(title, msg) {
      var tc = $('toastContainer');
      var t = document.createElement('div');
      t.className = 'bg-zinc-800 border border-zinc-700 text-white px-4 py-3 rounded-xl shadow-2xl text-xs w-64 transform transition-all duration-300 pointer-events-auto';
      t.innerHTML = '<b class="text-indigo-400 block mb-0.5">' + title + '</b>' + msg;
      tc.appendChild(t);
      setTimeout(function() { t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 300); }, 3500);
    };

    window.unlockPanel = function(e) {
      e.preventDefault();
      var pin = $('inpPin').value.trim();
      if (pin === targetPin) {
        $('loginView').classList.add('hidden');
        $('dashboardView').classList.remove('hidden');
        $('dashboardView').classList.add('flex');
        window.initMQTT();
        window.renderTelemetry();
      } else {
        window.showToast("Error", "PIN incorrecto");
        $('inpPin').value = '';
      }
    };

    function initMQTT() {
      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: 'ol_mst_' + masterDeviceId, clean: true, reconnectPeriod: 2500 });
      
      mqttClient.on('connect', function() {
        $('connDot').className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        $('connText').textContent = 'Conectado a Red (v4 / v5)';
        $('connText').className = 'text-[9px] font-mono text-emerald-400 uppercase';
        
        // Escuchamos en las dos frecuencias para detectar a todos los dispositivos
        mqttClient.subscribe('openline/v4/global/telemetry/report', { qos: 0 });
        mqttClient.subscribe('openline/v5/global/telemetry/report', { qos: 0 });
        
        window.requestTelemetryBroadcast();
        setInterval(window.renderTelemetry, 5000);
      });

      mqttClient.on('message', function(topic, message) {
        if (topic.endsWith('/telemetry/report')) {
          try {
            var data = JSON.parse(message.toString());
            window.saveTelemetryData(data);
          } catch(err) {}
        }
      });
    }

    window.requestTelemetryBroadcast = function() {
      if (mqttClient && mqttClient.connected) {
        // Solicitamos reporte en las dos frecuencias
        mqttClient.publish('openline/v4/global/telemetry/ping', JSON.stringify({ requesterId: masterDeviceId, timestamp: Date.now() }));
        mqttClient.publish('openline/v5/global/telemetry/ping', JSON.stringify({ requesterId: masterDeviceId, timestamp: Date.now() }));
        window.showToast("Sondeo", "Solicitando reporte a la red...");
      }
    };

    window.saveTelemetryData = function(data) {
      if(!data || !data.workshopId) return;
      var reg = {}; try { reg = JSON.parse(localStorage.getItem(TELEMETRY_KEY) || '{}'); } catch(e){}
      
      if(!reg[data.workshopId]) { 
        reg[data.workshopId] = { workshopId: data.workshopId, name: data.name || data.workshopId, devices: {}, licenseType: data.licenseType || 'DEMO', firstSeen: Date.now(), lastSeen: Date.now() }; 
      }
      
      reg[data.workshopId].lastSeen = Date.now();
      reg[data.workshopId].name = data.name || reg[data.workshopId].name;
      reg[data.workshopId].licenseType = data.licenseType || reg[data.workshopId].licenseType;
      
      if(data.deviceId) { 
        reg[data.workshopId].devices[data.deviceId] = { user: data.user || 'Admin', branch: data.branch || 'Central', lastSeen: Date.now() }; 
      }
      
      localStorage.setItem(TELEMETRY_KEY, JSON.stringify(reg));
      window.renderTelemetry();
    };

    window.renderTelemetry = function() {
      var reg = {}; try { reg = JSON.parse(localStorage.getItem(TELEMETRY_KEY) || '{}'); } catch(e){}
      var now = Date.now(); 
      var total = 0, online = 0, demo = 0, pro = 0;
      var html = '';

      var sortedWorkshops = Object.values(reg).sort(function(a, b) { return b.lastSeen - a.lastSeen; });

      sortedWorkshops.forEach(function(w) {
        total++;
        var isOnline = (now - w.lastSeen < 25000);
        var isPro = (w.licenseType === 'PRO' || w.licenseType === 'LIFETIME' || w.licenseType === 'SEM6');
        
        if (isOnline) online++;
        if (isPro) pro++; else demo++;

        // Calculamos solo los dispositivos que están encendidos en este preciso instante
        var activeDevCount = 0;
        for(var dId in (w.devices || {})) {
           if(now - w.devices[dId].lastSeen < 30000) { activeDevCount++; }
        }

        // Opciones de licencia
        var selectHtml = '<select id="selLic_' + w.workshopId + '" class="bg-zinc-900 border border-zinc-700 text-[10px] rounded-lg px-2 py-1.5 text-white outline-none font-bold">' +
                         '<option value="LIFETIME"' + (w.licenseType==='LIFETIME'?' selected':'') + '>Vitalicia</option>' +
                         '<option value="SEM6"' + (w.licenseType==='SEM6'?' selected':'') + '>6 Meses</option>' +
                         '<option value="DEMO"' + (w.licenseType==='DEMO'?' selected':'') + '>Demo</option>' +
                         '</select>';

        var sendBtn = '<button onclick="window.sendLicense(\'' + w.workshopId + '\', document.getElementById(\'selLic_' + w.workshopId + '\').value)" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[10px] transition shadow">Aplicar</button>';

        var badgeText = w.licenseType === 'LIFETIME' ? 'VITALICIA' : (w.licenseType === 'SEM6' ? '6 MESES' : 'DEMO');

        html += '<div class="p-3 bg-zinc-950 border border-zinc-800 hover:border-indigo-500/50 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm">' +
                  '<div class="flex-1">' +
                    '<div class="flex items-center gap-2 mb-1">' +
                      '<span class="w-2 h-2 rounded-full ' + (isOnline ? 'bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]' : 'bg-zinc-600') + '"></span>' +
                      '<b class="font-mono text-sm text-white">' + w.workshopId + '</b>' +
                      '<span class="text-[9px] px-1.5 py-0.5 rounded font-bold uppercase ' + (isPro ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800') + '">' + badgeText + '</span>' +
                    '</div>' +
                    '<div class="text-[10px] text-zinc-400">' + w.name + ' • ' + activeDevCount + ' equipo(s) activo(s) • ' + (isOnline ? '<span class="text-emerald-400">En línea ahora</span>' : 'Visto: ' + new Date(w.lastSeen).toLocaleString('es-AR')) + '</div>' +
                  '</div>' +
                  '<div class="flex items-center gap-1.5 bg-zinc-900 p-1.5 rounded-xl border border-zinc-800">' +
                    selectHtml + 
                    sendBtn +
                    '<button onclick="window.expelWorkshop(\'' + w.workshopId + '\')" class="ml-1 w-7 h-7 rounded-lg bg-rose-950 hover:bg-rose-900 border border-rose-800 text-rose-400 flex items-center justify-center transition" title="Expulsar de la red"><i class="ph-bold ph-trash"></i></button>' +
                  '</div>' +
                '</div>';
      });

      $('statTotal').textContent = total;
      $('statOnline').textContent = online;
      $('statDemo').textContent = demo;
      $('statPro').textContent = pro;
      
      var listEl = $('workshopsList');
      if (listEl) listEl.innerHTML = html || '<div class="text-center text-zinc-500 text-xs py-8">No hay talleres registrados aún en la base local. Haz clic en "Sondear Talleres".</div>';
    };

    window.generateKeyString = function(code) {
      return 'OL-LIFETIME-' + Math.abs((code + '_LIFETIME_OPENLINE_2026').split('').reduce(function(a,b){a=((a<<5)-a)+b.charCodeAt(0);return a&a;},0)).toString(16).toUpperCase().substring(0,6);
    };

    window.sendLicense = function(code, type) {
      if (!mqttClient || !mqttClient.connected) { window.showToast("Error", "No hay conexión al servidor MQTT"); return; }
      
      var typeLabels = { 'LIFETIME': 'VITALICIA', 'SEM6': '6 MESES', 'DEMO': 'DEMO' };

      if (confirm("¿Confirmas aplicar la licencia " + typeLabels[type] + " al taller " + code + "?")) {
        
        var key = 'OL-' + type + '-' + Math.abs((code + '_' + type + '_OPENLINE_2026').split('').reduce(function(a,b){a=((a<<5)-a)+b.charCodeAt(0);return a&a;},0)).toString(16).toUpperCase().substring(0,6);

        var expires = 9999999999999;
        var status = 'PRO';

        if (type === 'SEM6') {
          expires = Date.now() + (183 * 24 * 60 * 60 * 1000); 
        } else if (type === 'DEMO') {
          expires = 0;
          status = 'DEMO';
        }

        var licData = { type: type, key: key, workshopId: code, status: status, expiresAt: expires };

        mqttClient.publish('openline/v5/workshop/' + code + '/license', JSON.stringify(licData), { retain: true, qos: 1 });
        mqttClient.publish('openline/v5/workshop/' + code + '/command', JSON.stringify({ command: 'ACTIVATE_LICENSE', license: licData }));

        // Publicamos en v4 también para atrapar a los que aún no actualizaron el código.
        mqttClient.publish('openline/v4/workshop/' + code + '/license', JSON.stringify(licData), { retain: true, qos: 1 });

        var reg = JSON.parse(localStorage.getItem(TELEMETRY_KEY) || '{}');
        if(reg[code]) { 
          reg[code].licenseType = type; 
          localStorage.setItem(TELEMETRY_KEY, JSON.stringify(reg)); 
          window.renderTelemetry(); 
        }

        window.showToast("Licencia Emitida", "El taller " + code + " ahora está en " + typeLabels[type]);
      }
    };

    window.activateManual = function() {
      var code = $('manualCode').value.trim().toUpperCase();
      var type = $('manualType').value;
      if(!code.startsWith('TALLER-')) { window.showToast("Aviso", "El código debe tener el formato TALLER-XXXX"); return; }
      window.sendLicense(code, type);
      $('manualCode').value = '';
    };

    window.expelWorkshop = function(code) {
      if (confirm("⚠️ ¿Expulsar definitivamente la red " + code + " y desconectar todos sus dispositivos?")) {
        if (mqttClient && mqttClient.connected) {
          mqttClient.publish('openline/v5/workshop/' + code + '/command', JSON.stringify({ command: 'EXPEL_WORKSHOP', workshopId: code }));
          mqttClient.publish('openline/v4/workshop/' + code + '/command', JSON.stringify({ command: 'EXPEL_WORKSHOP', workshopId: code }));
        }
        var reg = JSON.parse(localStorage.getItem(TELEMETRY_KEY) || '{}');
        if(reg[code]) { delete reg[code]; localStorage.setItem(TELEMETRY_KEY, JSON.stringify(reg)); window.renderTelemetry(); }
        window.showToast("Eliminado", "Taller expulsado de la red.");
      }
    };
  </script>
</body>
</html>
