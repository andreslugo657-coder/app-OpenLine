<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Taller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="taller-logo-container">
            <!-- Aquí se mostrará el logo del taller cargado -->
            <img id="logo-preview" src="" alt="Logo del Taller" style="max-height: 50px; display: none;">
            <h1 id="taller-nombre">Mi Taller</h1>
        </div>
        <nav>
            <button onclick="mostrarSeccion('inicio')">Inicio</button>
            <button onclick="mostrarSeccion('configuracion')">Configuración</button>
        </nav>
    </header>

    <main>
        <!-- Sección de Inicio (Funcionalidad actual intacta) -->
        <section id="seccion-inicio" class="seccion">
            <h2>Panel Principal</h2>
            <p>Bienvenido al sistema. Todo está funcionando correctamente.</p>
        </section>

        <!-- Sección de Configuración con la nueva opción para subir el logo -->
        <section id="seccion-configuracion" class="seccion" style="display: none;">
            <h2>Configuración del Taller</h2>
            <form id="form-configuracion">
                <div class="form-group">
                    <label for="input-logo">Subir Logo del Taller:</label>
                    <input type="file" id="input-logo" accept="image/*">
                </div>
                <button type="button" onclick="guardarConfiguracion()">Guardar Cambios</button>
            </form>
        </section>
    </main>

    <script>
        function mostrarSeccion(seccion) {
            document.getElementById('seccion-inicio').style.display = seccion === 'inicio' ? 'block' : 'none';
            document.getElementById('seccion-configuracion').style.display = seccion === 'configuracion' ? 'block' : 'none';
        }

        // Lógica para previsualizar el logo seleccionado
        document.getElementById('input-logo').addEventListener('change', function(event) {
            const archivo = event.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    const logoPreview = document.getElementById('logo-preview');
                    logoPreview.src = e.target.result;
                    logoPreview.style.display = 'block';
                    // Opcional: Guardar en localStorage para persistencia
                    localStorage.setItem('tallerLogo', e.target.result);
                }
                lector.readAsDataURL(archivo);
            }
        });

        // Cargar el logo guardado previamente al iniciar
        window.onload = function() {
            const logoGuardado = localStorage.getItem('tallerLogo');
            if (logoGuardado) {
                const logoPreview = document.getElementById('logo-preview');
                logoPreview.src = logoGuardado;
                logoPreview.style.display = 'block';
            }
        }

        function guardarConfiguracion() {
            alert('Configuración guardada correctamente.');
        }
    </script>
</body>
</html>
