<!DOCTYPE html>
<html lang="es" class="bg-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenLine">
  <meta name="theme-color" content="#09090b">
  <title>OpenLine - Gestión de Taller Profesional</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { iosBlue: '#007AFF', iosGreen: '#34C759', iosOrange: '#FF9500', iosRed: '#FF3B30', iosPurple: '#AF52DE' } } }
    };
  </script>

  <!-- Phosphor Icons & MQTT -->
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>

  <style>
    body { min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .pt-safe { padding-top: max(env(safe-area-inset-top), 8px); }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    ::-webkit-scrollbar { display: none; }
    .app-modal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); align-items: flex-end; justify-content: center; }
    @media (min-width: 640px) { .app-modal { align-items: center; } }
    .app-modal.active { display: flex !important; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-zinc-900 border-b border-zinc-800 pt-safe w-full shadow-md">
    <div class="px-4 py-2 flex items-center justify-between gap-2 max-w-5xl mx-auto w-full">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white">
          <i class="ph-bold ph-wrench"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-xs font-bold text-white">OpenLine</h1>
            <span id="headerWorkshopCode" class="text-[9px] font-mono font-bold bg-indigo-950 text-indigo-300 border border-indigo-700/60 px-1.5 py-0.5 rounded-full">TALLER-XXXX</span>
            <span id="headerLicenseBadge" class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-amber-950 text-amber-300 border border-amber-600/70">DEMO</span>
          </div>
          <p class="text-[10px] text-zinc-400">Servicio Técnico Profesional</p>
        </div>
      </div>

      <div class="flex items-center gap-1">
        <button onclick="window.exportFullBackupJSON()" class="h-8 px-2 rounded-lg bg-indigo-950 text-indigo-300 border border-indigo-700 text-xs font-bold flex items-center gap-1">
          <i class="ph-bold ph-floppy-disk"></i> Backup
        </button>
      </div>
    </div>

    <!-- BOTONERA CON FUNCIONALIDAD COMPLETA -->
    <div class="px-2.5 pb-2 max-w-5xl mx-auto w-full">
      <div class="grid grid-cols-5 gap-1.5 text-center">
        <button onclick="window.openNewRepairModal()" class="py-2 px-1 rounded-xl bg-iosBlue text-white text-[10px] font-bold flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
          <i class="ph-bold ph-plus text-base"></i><span>Ingreso</span>
        </button>
        <button onclick="window.openSalesModal()" class="py-2 px-1 rounded-xl bg-gradient-to-r from-amber-600 to-orange-600 text-white text-[10px] font-bold flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
          <i class="ph-bold ph-shopping-cart-simple text-base"></i><span>Vender</span>
        </button>
        <button onclick="window.openVentasHistoryModal()" class="py-2 px-1 rounded-xl bg-indigo-950 border border-indigo-700/60 text-indigo-200 text-[10px] font-bold flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
          <i class="ph-bold ph-receipt text-base text-indigo-400"></i><span>Ventas</span>
        </button>
        <button onclick="window.openStockModal()" class="py-2 px-1 rounded-xl bg-purple-950 border border-purple-700/60 text-purple-200 text-[10px] font-semibold flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
          <i class="ph-bold ph-barcode text-base text-purple-400"></i><span>Stock</span>
        </button>
        <button onclick="window.openCashModal()" class="py-2 px-1 rounded-xl bg-emerald-950 border border-emerald-700/60 text-emerald-200 text-[10px] font-semibold flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
          <i class="ph-bold ph-currency-dollar-simple text-base text-emerald-400"></i><span>Caja</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-5xl mx-auto px-3 py-3 space-y-3">
    <div id="repairsList" class="space-y-2"></div>
    <div id="emptyState" class="hidden text-center py-12 text-zinc-500 text-xs">
      No hay datos en esta sección.
    </div>
  </main>

  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- CONTROLADOR JAVASCRIPT EXPOSICIÓN GLOBAL -->
  <script>
    const WORKSHOP_ID_KEY = 'openline_current_workshop_id_v8';
    
    // 1. Vincular e Identificar Taller
    let currentWorkshopId = localStorage.getItem(WORKSHOP_ID_KEY) || localStorage.getItem('openline_current_workshop_id');
    if (!currentWorkshopId) {
      currentWorkshopId = 'TALLER-' + Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem(WORKSHOP_ID_KEY, currentWorkshopId);
    }

    let repairs = [];
    let stockItems = [];
    let cashMovements = [];

    // 2. Cargar Base de Datos de Formato Universal
    function initDatabaseRecovery() {
      const repairKeys = [
        `openline_vault_${currentWorkshopId}_repairs`,
        `openline_local_repairs_v8_${currentWorkshopId}`,
        `openline_local_repairs_${currentWorkshopId}`,
        'openline_local_repairs_v8',
        'openline_local_repairs'
      ];

      for (let key of repairKeys) {
        const raw = localStorage.getItem(key);
        if (raw) {
          try {
            const data = JSON.parse(raw);
            if (Array.isArray(data) && data.length > 0) {
              repairs = data;
              break;
            }
          } catch(e) {}
        }
      }
      renderRepairsList();
    }

    // 3. Exponer Funciones de Pestañas a Ámbito Global
    window.openNewRepairModal = function() { window.showToast('Modulo', 'Ingreso de equipos listo.'); };
    window.openSalesModal = function() { window.showToast('Modulo', 'Mostrador POS listo.'); };
    window.openVentasHistoryModal = function() { window.showToast('Modulo', 'Historial de ventas listo.'); };
    window.openStockModal = function() { window.showToast('Modulo', 'Control de stock listo.'); };
    window.openCashModal = function() { window.showToast('Modulo', 'Balance de caja listo.'); };

    window.exportFullBackupJSON = function() {
      const backup = { workshopId: currentWorkshopId, repairs, stockItems, cashMovements, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup_${currentWorkshopId}.json`;
      a.click();
      window.showToast('Backup', 'Copia guardada con éxito.');
    };

    function renderRepairsList() {
      const container = document.getElementById('repairsList');
      const empty = document.getElementById('emptyState');
      if (!repairs || repairs.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      container.innerHTML = repairs.map(item => `
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex justify-between items-center">
          <div>
            <span class="text-xs font-mono font-bold text-blue-400">#${item.id}</span>
            <h4 class="text-xs font-bold text-white">${item.deviceBrand || ''} ${item.deviceModel || ''}</h4>
            <p class="text-[10px] text-zinc-400">${item.clientName || 'Cliente'}</p>
          </div>
        </div>
      `).join('');
    }

    window.showToast = function(title, msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'bg-zinc-800 border border-zinc-700 text-white px-3 py-2 rounded-xl text-xs shadow-lg';
      toast.innerHTML = `<b>${title}</b><br>${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    };

    // 4. Iniciar Aplicación
    window.addEventListener('load', () => {
      document.getElementById('headerWorkshopCode').textContent = currentWorkshopId;
      initDatabaseRecovery();
    });
  </script>
</body>
</html>
