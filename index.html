<!DOCTYPE html>
<html lang="es" class="bg-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenLine">
  <meta name="theme-color" content="#09090b">
  <title>OpenLine - Gestión de Taller Profesional</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { iosBlue: '#007AFF', iosGreen: '#34C759', iosOrange: '#FF9500', iosRed: '#FF3B30', iosPurple: '#AF52DE' } } }
    };
  </script>

  <!-- Phosphor Icons & Librerías -->
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body { min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .pt-safe { padding-top: max(env(safe-area-inset-top), 8px); }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    
    input, select, textarea { font-size: 16px !important; }
    
    /* ADAPTABILIDAD RESPONSIVE UNIVERSAL & CAPAS */
    header { pointer-events: auto !important; position: relative; z-index: 100 !important; }
    button, a, .cursor-pointer { touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; z-index: 150 !important; pointer-events: auto !important; }
    
    ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .app-modal {
      display: none; position: fixed; inset: 0; z-index: 99999;
      background-color: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
      padding: max(env(safe-area-inset-top), 12px) 12px max(env(safe-area-inset-bottom), 12px) 12px;
      pointer-events: auto !important;
    }
    .modal-card { width: 100%; max-width: 540px; max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column; overflow: hidden; }

    .ticker-wrap { width: 100%; overflow: hidden; background-color: #09090b; border-top: 1px solid #27272a; padding: 5px 0; flex-shrink: 0; }
    .ticker { display: inline-block; white-space: nowrap; padding-right: 100%; box-sizing: content-box; animation: ticker 25s linear infinite; }
    @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; display: block !important; background: white !important; color: black !important; }
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased flex flex-col min-h-screen relative z-0 items-center">

  <div class="w-full max-w-6xl mx-auto flex flex-col min-h-screen shadow-2xl bg-zinc-950 border-x border-zinc-900">
    
    <header class="sticky top-0 bg-zinc-900 border-b border-zinc-800 pt-safe w-full shadow-md shrink-0">
      <div class="px-4 py-2.5 flex items-center justify-between gap-3 w-full">
        <div class="flex items-center gap-2.5 min-w-0">
          <div id="headerLogoContainer" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center overflow-hidden shadow shrink-0">
            <i id="headerDefaultIcon" class="ph-bold ph-wrench text-white text-base"></i>
            <img id="headerCustomLogo" src="" alt="Logo" class="w-full h-full object-cover hidden">
          </div>
          <div class="min-w-0 flex flex-col">
            <div class="flex items-center gap-1.5 flex-wrap">
              <h1 id="appHeaderTitle" class="text-xs sm:text-sm font-bold text-white tracking-tight truncate">OpenLine</h1>
              <button type="button" onclick="window.openTeamModal()" class="text-[10px] font-mono font-bold bg-indigo-950 text-indigo-300 border border-indigo-700/60 px-2 py-0.5 rounded-full flex items-center gap-1 active:opacity-75 transition cursor-pointer">
                <span id="livePulseDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="headerWorkshopCode">TALLER-MASTER</span>
              </button>
              <span class="text-[10px] font-mono bg-emerald-950 border border-emerald-700/60 text-emerald-400 px-2 py-0.5 rounded-full flex items-center gap-1">
                <i class="ph-bold ph-users text-[10px]"></i> <span id="onlineUsersCount">1</span>
              </span>
              <button type="button" id="headerLicenseBtn" onclick="window.openLicenseModal()" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-950 border border-amber-600/70 text-amber-300 flex items-center gap-1 active:opacity-75 transition cursor-pointer">
                <i class="ph-bold ph-shield-check"></i> <span id="headerLicenseText">DEMO</span>
              </button>
            </div>
            <span id="appHeaderSubtitle" class="text-[11px] text-zinc-400 font-medium truncate">Servicio Técnico Profesional</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" onclick="window.forceCloudSync()" class="w-9 h-9 rounded-xl bg-zinc-800 text-emerald-400 border border-zinc-700 flex items-center justify-center active:scale-95 transition shadow-sm cursor-pointer" title="Sincronizar Cloud">
            <i class="ph-bold ph-cloud-arrow-down text-base"></i>
          </button>
          <button type="button" onclick="window.openSwitchUserModal()" class="h-9 px-2.5 rounded-xl bg-zinc-800 text-zinc-200 border border-zinc-700 flex items-center gap-1.5 active:scale-95 transition shadow-sm text-xs font-bold cursor-pointer" title="Personal y Dispositivos">
            <i class="ph-bold ph-user-circle text-base text-iosBlue"></i>
            <span id="headerActiveUserDisplay" class="max-w-[80px] truncate">Admin</span>
          </button>
          <button type="button" onclick="window.openSettingsModal()" class="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-300 border border-zinc-700 flex items-center justify-center active:scale-95 transition shadow-sm cursor-pointer" title="Ajustes">
            <i class="ph-bold ph-gear text-base"></i>
          </button>
          <button type="button" onclick="window.openInstallModal()" class="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-300 border border-zinc-700 flex items-center justify-center active:scale-95 transition shadow-sm cursor-pointer" title="Compartir App">
            <i class="ph-bold ph-share-network text-base"></i>
          </button>
        </div>
      </div>

      <!-- BOTONERA PRINCIPAL -->
      <div class="px-3 pb-2.5 w-full">
        <div class="grid grid-cols-6 gap-1.5 text-center">
          <button type="button" onclick="window.openNewRepairModal()" class="py-2.5 px-1 rounded-xl bg-iosBlue text-white text-[11px] font-bold shadow-md flex flex-col items-center justify-center gap-1 active:scale-95 transition transform cursor-pointer">
            <i class="ph-bold ph-plus text-base"></i><span>Ingreso</span>
          </button>
          <button type="button" onclick="window.openClientsModal()" class="py-2.5 px-1 rounded-xl bg-gradient-to-r from-blue-700 to-indigo-700 text-white text-[11px] font-bold shadow-md flex flex-col items-center justify-center gap-1 active:scale-95 transition transform cursor-pointer">
            <i class="ph-bold ph-address-book text-base"></i><span>Clientes</span>
          </button>
          <button type="button" onclick="window.openSalesModal()" class="py-2.5 px-1 rounded-xl bg-gradient-to-r from-amber-600 to-orange-600 text-white text-[11px] font-bold shadow-md flex flex-col items-center justify-center gap-1 active:scale-95 transition transform cursor-pointer">
            <i class="ph-bold ph-shopping-cart-simple text-base"></i><span>Vender</span>
          </button>
          <button type="button" onclick="window.openVentasHistoryModal()" class="py-2.5 px-1 rounded-xl bg-gradient-to-r from-indigo-900 to-blue-900 border border-indigo-700/60 text-indigo-200 text-[11px] font-bold shadow-md flex flex-col items-center justify-center gap-1 active:scale-95 transition transform cursor-pointer">
            <i class="ph-bold ph-receipt text-base text-indigo-400"></i><span>Ventas</span>
          </button>
          <button type="button" onclick="window.openStockModal()" class="py-2.5 px-1 rounded-xl bg-purple-950 border border-purple-700/60 text-purple-200 text-[11px] font-semibold flex flex-col items-center justify-center gap-1 active:scale-95 transition transform cursor-pointer">
            <i class="ph-bold ph-barcode text-base text-purple-400"></i><span>Stock</span>
          </button>
          <button type="button" onclick="window.openCashModal()" class="py-2.5 px-1 rounded-xl bg-emerald-950 border border-emerald-700/60 text-emerald-200 text-[11px] font-semibold flex flex-col items-center justify-center gap-1 active:scale-95 transition transform cursor-pointer">
            <i class="ph-bold ph-currency-dollar-simple text-base text-emerald-400"></i><span>Caja</span>
          </button>
        </div>
      </div>
    </header>

    <!-- CUERPO PRINCIPAL -->
    <main class="flex-1 w-full px-3 py-3 space-y-2.5 pb-safe overflow-y-auto relative z-10">
      <div id="branchFilterContainer" class="bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 shadow-sm space-y-1.5">
        <div class="flex items-center justify-between px-1">
          <span class="text-[10px] font-bold uppercase text-zinc-400 flex items-center gap-1"><i class="ph-bold ph-eye text-rose-400 text-xs"></i> Sucursal Operativa / Vista:</span>
          <span id="currentBranchDisplayTag" class="text-[11px] font-mono text-zinc-300">Todas</span>
        </div>
        <div id="branchTabsButtonsList" class="flex gap-1.5 overflow-x-auto no-scrollbar text-xs font-medium pb-0.5"></div>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
        <button type="button" onclick="window.openCashModal()" class="w-full text-center bg-gradient-to-br from-zinc-900 to-emerald-950/40 border border-emerald-900/40 rounded-xl p-2.5 shadow-sm active:scale-95 transition cursor-pointer relative z-20">
          <span class="text-[10px] text-emerald-400 font-bold flex items-center justify-center gap-1"><i class="ph-bold ph-wallet"></i> Saldo Caja (<span id="headerCashBranchTag">Central</span>)</span>
          <span id="headerCashBalance" class="text-sm sm:text-base font-extrabold text-emerald-300 font-mono mt-0.5 block">$0</span>
        </button>
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-center shadow-sm">
          <span class="text-[10px] text-zinc-400 block font-bold uppercase">Espera</span><span id="counterReceived" class="text-sm sm:text-base font-bold text-white mt-0.5 block">0</span>
        </div>
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-center shadow-sm">
          <span class="text-[10px] text-amber-400 block font-bold uppercase">Taller</span><span id="counterInProgress" class="text-sm sm:text-base font-bold text-amber-400 mt-0.5 block">0</span>
        </div>
        <div class="bg-zinc-900 border border-violet-800/60 rounded-xl p-2.5 text-center shadow-sm">
          <span class="text-[10px] text-violet-400 block font-bold uppercase">Repuestos</span><span id="counterWaitingParts" class="text-sm sm:text-base font-bold text-violet-300 mt-0.5 block">0</span>
        </div>
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-center shadow-sm">
          <span class="text-[10px] text-indigo-400 block font-bold uppercase">En Viaje</span><span id="counterTransit" class="text-sm sm:text-base font-bold text-indigo-400 mt-0.5 block">0</span>
        </div>
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-center shadow-sm">
          <span class="text-[10px] text-emerald-400 block font-bold uppercase">Listos</span><span id="counterReady" class="text-sm sm:text-base font-bold text-emerald-400 mt-0.5 block">0</span>
        </div>
      </div>

      <div class="space-y-2">
        <div class="relative">
          <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
          <input id="searchInput" type="text" oninput="window.handleSearch()" placeholder="Buscar orden, cliente, modelo, DNI/CUIT o sucursal..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-9 pr-9 py-2.5 text-xs sm:text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-iosBlue shadow-sm">
          <button type="button" id="clearSearchBtn" onclick="window.clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 p-1 cursor-pointer"><i class="ph-bold ph-x-circle text-sm"></i></button>
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
          <button type="button" onclick="window.setFilter('ALL')" id="tabALL" class="filter-tab px-3 py-1.5 rounded-xl bg-zinc-800 text-white font-bold shrink-0 transition text-xs cursor-pointer relative z-20">Activos</button>
          <button type="button" onclick="window.setFilter('WAITING')" id="tabWAITING" class="filter-tab px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 font-medium shrink-0 transition text-xs cursor-pointer relative z-20">Espera</button>
          <button type="button" onclick="window.setFilter('IN_PROGRESS')" id="tabIN_PROGRESS" class="filter-tab px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 font-medium shrink-0 transition text-xs cursor-pointer relative z-20">Taller</button>
          <button type="button" onclick="window.setFilter('WAITING_PARTS')" id="tabWAITING_PARTS" class="filter-tab px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 font-medium shrink-0 transition text-xs cursor-pointer relative z-20">Repuestos</button>
          <button type="button" onclick="window.setFilter('IN_TRANSIT')" id="tabIN_TRANSIT" class="filter-tab px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 font-medium shrink-0 transition text-xs cursor-pointer relative z-20">Viaje</button>
          <button type="button" onclick="window.setFilter('READY')" id="tabREADY" class="filter-tab px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 font-medium shrink-0 transition text-xs cursor-pointer relative z-20">Listos (Archivados)</button>
        </div>
      </div>

      <div id="repairsList" class="space-y-2.5 pb-6"></div>
      <div id="emptyState" class="hidden text-center py-10 px-4">
        <div class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center mx-auto mb-2 text-zinc-600"><i class="ph-bold ph-clipboard-text text-2xl"></i></div>
        <h3 class="text-xs sm:text-sm font-semibold text-zinc-400">No hay órdenes registradas</h3>
      </div>
    </main>

    <div class="ticker-wrap pb-safe border-t border-zinc-800">
      <div class="ticker text-[10px] font-bold text-zinc-500 tracking-widest uppercase flex items-center gap-3">
        <span>🚀 DESARROLLADO POR OPENLINE • INDUSTRIA ARGENTINA 🇦🇷 • SOFTWARE PARA TALLERES PROFESIONALES 🚀</span>
      </div>
    </div>
  </div>

  <!-- MODALES DE ALERTA INTERNOS -->
  <div id="appPromptModal" style="display: none; z-index: 100005;" class="app-modal">
    <div class="bg-zinc-900 border border-zinc-700 rounded-3xl w-full max-w-xs p-5 space-y-4 shadow-2xl text-center relative">
      <h3 class="font-black text-white text-sm" id="appPromptTitle">Mensaje</h3>
      <p class="text-[11px] text-zinc-400 leading-tight whitespace-pre-line" id="appPromptDesc"></p>
      <form onsubmit="window.confirmAppPrompt(event)" class="w-full m-0 p-0">
        <input type="text" id="appPromptInput" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-3 text-white text-center font-bold text-sm outline-none focus:border-iosBlue transition-colors mb-2" autocomplete="off">
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="window.closeAppPrompt(null)" class="py-2.5 bg-zinc-800 text-white font-bold rounded-xl text-xs active:scale-95 transition cursor-pointer">Cancelar</button>
          <button type="submit" class="py-2.5 bg-iosBlue text-white font-bold rounded-xl text-xs active:scale-95 transition cursor-pointer">Aceptar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="appConfirmModal" style="display: none
