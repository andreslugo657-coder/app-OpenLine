<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLine · Panel Maestro</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; background: #09090b; color: #f4f4f5; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #1e1b4b, #09090b 45%); }
    main { width: min(92vw, 760px); background: #18181b; border: 1px solid #3f3f46; border-radius: 20px; padding: 24px; box-sizing: border-box; box-shadow: 0 20px 70px #0008; }
    h1 { margin: 0 0 4px; font-size: 22px; } p { color: #a1a1aa; font-size: 13px; }
    label { display: block; color: #a1a1aa; font-size: 12px; margin: 12px 0 5px; } input, select, button { box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #52525b; background: #09090b; color: #fff; }
    button { cursor: pointer; background: #4f46e5; border-color: #6366f1; font-weight: 700; } button.secondary { background: #27272a; border-color: #52525b; } button.danger { background: #4c0519; border-color: #9f1239; }
    .row { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); } .stack { display: grid; gap: 10px; }
    .hidden { display: none !important; } .card { padding: 14px; border: 1px solid #3f3f46; border-radius: 14px; background: #09090b; margin-top: 14px; }
    .toolbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; } .toolbar button { width: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; } th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid #27272a; vertical-align: middle; } th { color: #a1a1aa; }
    .pill { border-radius: 999px; padding: 3px 7px; font-size: 10px; background: #064e3b; color: #a7f3d0; } .muted { color: #71717a; } .notice { padding: 10px; border-radius: 10px; background: #422006; color: #fde68a; font-size: 12px; margin-top: 12px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } main { padding: 16px; } table { font-size: 11px; } }
  </style>
</head>
<body>
<main>
  <section id="loginView">
    <h1>Panel Maestro</h1>
    <p>Superficie separada de la app de talleres. La contraseña se valida en el servidor y nunca se envía a los talleres.</p>
    <form id="loginForm" class="stack">
      <label for="masterPassword">Contraseña maestra</label>
      <input id="masterPassword" type="password" autocomplete="current-password" minlength="8" required>
      <button type="submit">Entrar de forma segura</button>
    </form>
  </section>

  <section id="adminView" class="hidden">
    <div class="toolbar"><div><h1>Panel Maestro</h1><p>Licencias y alta de talleres</p></div><button id="logoutBtn" class="secondary">Cerrar sesión</button></div>
    <div id="notice" class="notice hidden"></div>

    <div class="card">
      <h2 style="font-size:15px;margin:0">Crear taller maestro</h2>
      <form id="createForm" class="stack">
        <div class="row">
          <div><label for="workshopId">Código (opcional)</label><input id="workshopId" placeholder="TALLER-1000" pattern="TALLER-[A-Z0-9_-]{3,42}"></div>
          <div><label for="workshopName">Nombre</label><input id="workshopName" required placeholder="Servicio Técnico"></div>
        </div>
        <label for="joinPassword">Contraseña de unión (mínimo 8 caracteres)</label>
        <input id="joinPassword" type="password" minlength="8" required autocomplete="new-password">
        <button type="submit">Crear taller</button>
      </form>
      <div id="createdResult" class="notice hidden"></div>
    </div>

    <div class="card">
      <div class="toolbar"><h2 style="font-size:15px;margin:0">Talleres registrados</h2><button id="refreshBtn" class="secondary">Actualizar</button></div>
      <div style="overflow:auto"><table><thead><tr><th>Código</th><th>Nombre</th><th>Licencia</th><th>Miembros</th><th>Acción</th></tr></thead><tbody id="workshopsBody"></tbody></table></div>
    </div>
  </section>
</main>
<script>
  (function () {
    'use strict';
    var key = 'openline_master_session_v1';
    var session = null;
    try { session = JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (_) {}
    function headers() { return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (session && session.sessionToken) }; }
    async function api(path, options) {
      var response = await fetch(path, options);
      var body = {};
      try { body = await response.json(); } catch (_) {}
      if (!response.ok) throw new Error(body.error || 'request_failed');
      return body;
    }
    function notice(text, target) {
      var el = document.getElementById(target || 'notice');
      if (!el) return;
      el.textContent = text; el.classList.remove('hidden');
    }
    function saveSession(value) { session = value; sessionStorage.setItem(key, JSON.stringify(value)); }
    function clearSession() { session = null; sessionStorage.removeItem(key); }
    function showAdmin() { document.getElementById('loginView').classList.add('hidden'); document.getElementById('adminView').classList.remove('hidden'); loadWorkshops(); }
    async function loadWorkshops() {
      try {
        var result = await api('/api/master/workshops', { headers: headers() });
        document.getElementById('workshopsBody').innerHTML = result.workshops.map(function (w) {
          return '<tr><td><b>' + w.workshopId + '</b></td><td>' + w.name + '</td><td><span class="pill">' + w.license.type + '</span></td><td>' + w.members + '</td><td><button class="secondary issueBtn" data-id="' + w.workshopId + '">Emitir licencia</button></td></tr>';
        }).join('') || '<tr><td colspan="5" class="muted">Todavía no hay talleres.</td></tr>';
        Array.prototype.forEach.call(document.querySelectorAll('.issueBtn'), function (button) {
          button.addEventListener('click', function () { issueLicense(button.dataset.id); });
        });
      } catch (error) { clearSession(); document.getElementById('adminView').classList.add('hidden'); document.getElementById('loginView').classList.remove('hidden'); notice('La sesión expiró. Vuelve a entrar.'); }
    }
    async function issueLicense(workshopId) {
      try {
        var result = await api('/api/master/workshops/' + encodeURIComponent(workshopId) + '/license', { method: 'POST', headers: headers(), body: JSON.stringify({ type: 'LIFETIME' }) });
        notice('Licencia generada para ' + result.workshopId + ': ' + result.key, 'createdResult');
        loadWorkshops();
      } catch (error) { notice('No se pudo generar la licencia: ' + error.message); }
    }
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      try {
        var result = await api('/api/master/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('masterPassword').value }) });
        saveSession(result); document.getElementById('masterPassword').value = ''; showAdmin();
      } catch (error) { notice('Credenciales inválidas o demasiados intentos.'); }
    });
    document.getElementById('createForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      try {
        var result = await api('/api/master/workshops', { method: 'POST', headers: headers(), body: JSON.stringify({
          workshopId: document.getElementById('workshopId').value,
          name: document.getElementById('workshopName').value,
          password: document.getElementById('joinPassword').value
        }) });
        notice('Taller creado: ' + result.workshop.workshopId + '. Entrega esta contraseña solo a los dispositivos autorizados.', 'createdResult');
        document.getElementById('createForm').reset(); loadWorkshops();
      } catch (error) { notice('No se pudo crear el taller: ' + error.message); }
    });
    document.getElementById('refreshBtn').addEventListener('click', loadWorkshops);
    document.getElementById('logoutBtn').addEventListener('click', function () { clearSession(); location.reload(); });
    if (session && session.sessionToken) showAdmin();
  }());
</script>
</body>
</html>
